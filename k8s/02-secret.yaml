# Do NOT commit real values. Populate via `kubectl create secret` or a
# secrets manager (AWS Secrets Manager + External Secrets Operator) instead
# of editing this file directly in a real deployment.
#
# Example (imperative, preferred over editing this file):
#   kubectl create secret generic aegis-secrets -n aegis-ai \
#     --from-literal=SECRET_KEY=$(openssl rand -hex 32) \
#     --from-literal=DATABASE_URL=mysql+pymysql://aegis:PASSWORD@<rds-endpoint>:3306/aegis_governance \
#     --from-literal=GROQ_API_KEY=xxxx \
#     --from-literal=PINECONE_API_KEY=xxxx \
#     --from-literal=MYSQL_ROOT_PASSWORD=xxxx \
#     --from-literal=MYSQL_PASSWORD=xxxx
apiVersion: v1
kind: Secret
metadata:
  name: aegis-secrets
  namespace: aegis-ai
type: Opaque
stringData:
  SECRET_KEY: "REPLACE_ME"
  DATABASE_URL: "mysql+pymysql://aegis:REPLACE_ME@aegis-mysql-service:3306/aegis_governance"
  GROQ_API_KEY: "REPLACE_ME"
  PINECONE_API_KEY: "REPLACE_ME"
  MYSQL_ROOT_PASSWORD: "REPLACE_ME"
  MYSQL_PASSWORD: "REPLACE_ME"
