apiVersion: v1
kind: Service
metadata:
  name: aegis-app-service
  namespace: aegis-ai
spec:
  selector:
    app: aegis-app
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
---
# Requires the AWS Load Balancer Controller installed on the EKS cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aegis-app-ingress
  namespace: aegis-ai
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}, {"HTTP":80}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    # alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:REGION:ACCOUNT:certificate/CERT_ID
spec:
  rules:
    - host: aegis.yourdomain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aegis-app-service
                port:
                  number: 80
