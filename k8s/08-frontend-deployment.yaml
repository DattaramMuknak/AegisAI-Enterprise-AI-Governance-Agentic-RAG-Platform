apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-frontend
  namespace: aegis-ai
  labels:
    app: aegis-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aegis-frontend
  template:
    metadata:
      labels:
        app: aegis-frontend
    spec:
      containers:
        - name: aegis-frontend
          image: <ECR_REPO>/aegis-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
            - containerPort: 5173
          env:
            - name: VITE_API_URL
              value: "http://aegis-app-service:8000"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: aegis-frontend-service
  namespace: aegis-ai
spec:
  type: ClusterIP
  selector:
    app: aegis-frontend
  ports:
    - port: 80
      targetPort: 80
      name: http
    - port: 5173
      targetPort: 5173
      name: dev
